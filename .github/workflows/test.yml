name: test-back
on:
    pull_request:

jobs:
  test :
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: npm ci
      run: npm ci
    - name: launch test
      run: npm run test