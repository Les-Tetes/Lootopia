name: test
on:
    pull_request:
      # PR vers main : appelé par pre-release.yml
      branches-ignore: [main]
    workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test :
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: npm ci
      run: npm ci
    - name: launch test
      run: npm run test