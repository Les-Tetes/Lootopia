name: Release

# Se lance quand develop est fusionnée dans main
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version_release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build

      - name: Create release
        id: version_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Dernière version : $LAST_TAG"

          # Liste des commits depuis cette version (servira de changelog)
          if [ "$LAST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --no-merges --format="- %s")
          else
            COMMITS=$(git log $LAST_TAG..HEAD --no-merges --format="- %s")
          fi

          # 3. Découpe la version : v0.3.2 => MAJOR=0, MINOR=3, PATCH=2
          MAJOR=$(echo $LAST_TAG | cut -d. -f1 | tr -d v)
          MINOR=$(echo $LAST_TAG | cut -d. -f2)
          PATCH=$(echo $LAST_TAG | cut -d. -f3)

          # 4. Nouvelle version : un "feat" => 0.4.0, sinon => 0.3.3
          if echo "$COMMITS" | grep -q "^- feat"; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          echo "Nouvelle version : $NEW_TAG"

          # 5. Crée le tag git et la GitHub Release, avec les commits comme changelog
          gh release create $NEW_TAG --target $GITHUB_SHA --title $NEW_TAG --notes "$COMMITS"

          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.version_release.outputs.tag }}
          path: |
            apps/api/dist/
            apps/web/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.release.outputs.tag }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.release.outputs.tag }}
          path: build

      - name: Attach build to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          (cd build/api/dist && zip -r "$GITHUB_WORKSPACE/lootopia-api-$TAG.zip" .)
          (cd build/web/dist && zip -r "$GITHUB_WORKSPACE/lootopia-web-$TAG.zip" .)
          gh release upload "$TAG" lootopia-api-$TAG.zip lootopia-web-$TAG.zip --repo "$GITHUB_REPOSITORY"

