# Vérifie que le titre de la Pull Request respecte Conventional Commits (§ 11.1 du cahier des charges)
name: PR title

on:
  pull_request:
    branches: [main, develop]
    # `edited` : relance le check quand on corrige le titre
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check PR title
        # Titre passé par variable d'environnement, jamais interpolé dans le script (injection)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(\([a-z0-9._/-]+\))?!?: [^ ].*[^.]$'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "Titre conforme : $PR_TITLE"
            exit 0
          fi
          {
            echo "::error title=Titre de PR non conforme::\"$PR_TITLE\" ne respecte pas Conventional Commits."
            echo "Format attendu : <type>(contexte optionnel): <description courte à l'impératif>"
            echo "Types autorisés : feat, fix, docs, style, refactor, perf, test, build, ci, chore"
            echo "Exemple : feat(api): ajoute l'inscription par e-mail"
          } >&2
          exit 1
