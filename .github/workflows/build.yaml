name: Build

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'package-lock.json'
      - '.github/workflows/build.yaml'

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
