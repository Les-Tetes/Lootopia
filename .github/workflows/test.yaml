name: Test

on:
  pull_request:

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Comment
        run: gh pr comment ${{ github.event.pull_request.number }} --body "coucou" 
        env : 
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        